<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Scratchpad</title>
    <script>
      // Apply the theme and the user's color before first paint, so neither flashes. Keep in sync
      // with theme.ts, which takes over once the app loads.
      let theme;
      let hue;
      try {
        theme = localStorage.getItem("theme");
        hue = localStorage.getItem("hue");
      } catch {}
      if (hue === "neutral") {
        document.documentElement.style.setProperty("--tint", "0");
      } else if (hue !== null && hue !== undefined && Number.isFinite(Number(hue))) {
        document.documentElement.style.setProperty("--hue", hue);
      }
      const dark =
        theme === "dark" ||
        (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
